<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blackjack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Blackjack Tracker</title>
<style>
/* Layout: one-screen phone app, single dark theme by choice. Black ground, grey panels,
   one muted gold reserved for the single thing that matters on each screen. */
:root{
  --bg:#0A0A0B; --panel:#151517; --raised:#222226; --line:#26262A;
  --text:#F2F2F3; --mid:#C9C9CE; --dim:#9A9AA2; --gold:#D9B26A; --good:#7FD6A4; --bad:#F0897B;
  --font:-apple-system,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums;overscroll-behavior:none}
body{-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 28px;display:flex;flex-direction:column;gap:14px}
.screen.enter{animation:enter .34s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:15px;font-weight:600}
.dim{color:var(--dim)} .mid{color:var(--mid)} .gold{color:var(--gold)} .pos{color:var(--good)} .neg{color:var(--text)}
.s13{font-size:13px} .s15{font-size:15px} .s17{font-size:17px}
.head{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.panel{background:var(--panel);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rows{background:var(--panel);border-radius:20px;padding:2px 16px;display:flex;flex-direction:column}
.rowi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px;min-height:52px}
.rowi:last-child{border-bottom:0}
.sp{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.col{display:flex;flex-direction:column;gap:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.med{font-size:24px;font-weight:700;letter-spacing:-.02em}
.grow{flex:1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
.press{transition:transform .5s var(--ease),opacity .2s,background .2s}
.press:active{transform:scale(.96);transition:transform .08s}
.btn{height:54px;border-radius:16px;background:var(--text);color:var(--bg);font-size:17px;font-weight:600;width:100%;flex:none}
.btn.gold{background:var(--gold)} .btn.soft{background:var(--panel);color:var(--text)} .btn.sm{height:44px;width:auto;padding:0 18px;border-radius:12px;font-size:16px}
.btn:disabled{opacity:.4}
.txt{height:44px;font-size:16px;color:var(--dim)} .txt.on{color:var(--text);font-weight:600}
.icon{width:40px;height:40px;border-radius:20px;background:var(--panel);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;position:relative}
.seg.on-panel{background:var(--bg)}
.seg button{flex:1;height:34px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--dim);position:relative;z-index:1;transition:color .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--text);font-weight:600}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:9px;background:var(--raised);transition:left .32s var(--ease),width .32s var(--ease)}
.seg.tall button{height:44px;font-size:15px}
.step{display:flex;align-items:center;gap:12px}
.step b{min-width:64px;text-align:right;font-weight:600;font-size:17px}
.step button{width:34px;height:34px;border-radius:17px;background:var(--raised);font-size:20px;line-height:1;display:grid;place-items:center}
.tabbar{display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line);background:var(--bg);flex:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--dim);width:84px;height:46px;justify-content:center}
.tabbar button[aria-current="page"]{color:var(--text)}
.cta{padding:10px 20px 12px;flex:none}
/* hold button */
.hold{position:relative;overflow:hidden;-webkit-touch-callout:none}
.hold i,.hold span{pointer-events:none}
.hold i{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .18s}
.hold.holding i{transform:scaleX(1);transition:transform .9s linear}
.hold span{position:relative}
/* charts */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .cur{position:absolute;top:0;bottom:0;width:1px;background:var(--dim);pointer-events:none}
.chart .dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--panel);pointer-events:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--gold);transition:width .5s var(--ease)}
.hbar{height:8px;border-radius:4px;transition:width .5s var(--ease)}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--raised)} .dots i.on{background:var(--gold)}
/* live */
.live-num{font-size:min(31vw,128px);font-weight:700;letter-spacing:-.05em;line-height:1}
.instr{border-radius:20px;background:var(--panel);padding:16px;min-height:80px;display:flex;flex-direction:column;gap:12px;justify-content:center;border:1px solid transparent;transition:border-color .3s}
.instr.hot{border-color:var(--gold)}
.instr.swap{animation:enter .3s var(--ease)}
.bigbtn{flex:1;height:68px;border-radius:20px;background:var(--panel);font-size:22px;font-weight:600}
.paused .live-num,.paused .bigbtn{opacity:.35}
/* sheets */
#sheet{position:fixed;inset:0;z-index:10;pointer-events:none}
#sheet .back{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
#sheet .body{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92%;overflow-y:auto;background:#19191C;border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:14px;transform:translateY(102%);transition:transform .42s var(--ease)}
#sheet.open{pointer-events:auto} #sheet.open .back{opacity:1} #sheet.open .body{transform:none}
#sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--raised);margin:0 auto 6px;flex:none}
#sheet .rows,#sheet .panel{background:var(--bg)}
input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;user-select:text;-webkit-user-select:text}
input.hero{font-size:44px;font-weight:700;letter-spacing:-.03em;text-align:center;border:0;background:none;padding:6px 0}
textarea{min-height:96px;resize:none;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim)}
.badge{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.badge:last-child{border-bottom:0}
.badge i{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--raised);display:grid;place-items:center}
.badge.on i{background:var(--gold);border-color:var(--gold)}
.badge.off{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div id="root" style="flex:1;display:flex;flex-direction:column;min-height:0"></div></div>
<div id="sheet"><div class="back" data-a="closeSheet"></div><div class="body" role="dialog" aria-modal="true"></div></div>
<script>
(function(){
"use strict";
/* ================= data ================= */
var SEED=[90,-70,45,67.5,-40,75,25,-100,140,-300,-90,125,110,50,-260,50,-40,-60,35,75,-150,-360];
var RATE={solo:200,few:110,full:65};
var TABLE={solo:"Just me",few:"2–3 players",full:"4 or more",mixed:"Mixed"};
var MOOD={1:"Rough",2:"Fine",3:"Good"};
var EXIT=["Stack gone","Locked a win","Tired","Had enough","Chasing","Other"];
var DEF={cur:"$",budget:0,cooloffH:24,checkinMin:60,buyIn:100,bet:5,lockAt:200,keep:100,note:"The buy-in is the ticket price. When it's gone, the night was still a good one. Go home."};
function seed(){return {v:1,updatedAt:1,settings:clone(DEF),live:null,sessions:SEED.map(function(n,i){var last=i===SEED.length-1;
  return {id:"v"+(i+1),ts:i+1,date:last?"2026-11-15":null,net:n,bet:10,hands:last?550:225,minutes:last?270:null,kept:null,legacy:true};})};}
var state=seed(), db=null, pushTimer=null, writing=false, writeNext=false;
var ui={tab:"home",flow:null,reviewId:null,range:"all",by:"table",pre:{size:"few",mood:2},sheet:null,lastKey:""};
var charts={};
function clone(o){return JSON.parse(JSON.stringify(o));}
function normalize(s){s.settings=Object.assign(clone(DEF),s.settings||{});s.sessions=s.sessions||[];s.live=s.live||null;return s;}
function loadLocal(){try{var s=JSON.parse(localStorage.getItem("bj-tracker")||"null");if(s&&s.sessions)state=normalize(s);}catch(e){}}
function save(){state.updatedAt=Date.now();try{localStorage.setItem("bj-tracker",JSON.stringify(state));}catch(e){}
  if(db){clearTimeout(pushTimer);pushTimer=setTimeout(push,500);}}
function push(){pushTimer=null;if(!db)return;if(writing){writeNext=true;return;}writing=true;
  db.doc("app/state").set(clone(state)).catch(function(){}).then(function(){writing=false;if(writeNext){writeNext=false;push();}});}
function connect(){if(!(window.claude&&window.claude.use))return;
  Promise.resolve(window.claude.use("db")).then(function(d){if(!d)return;db=d;
    d.doc("app/state").onSnapshot(function(s){
      if(!s.exists){push();return;}
      var r=s.data(),ru=r.updatedAt||0,lu=state.updatedAt||0;
      if(ru>lu&&!pushTimer&&!writing){state=normalize(clone(r));try{localStorage.setItem("bj-tracker",JSON.stringify(state));}catch(e){}
        if(!ui.sheet)render(true);}
      else if(ru<lu&&!pushTimer&&!writing)push();
    },function(){});
  }).catch(function(){});}

/* ================= helpers ================= */
function S(){return state.settings;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v,d){var n=parseFloat(v);return isFinite(n)?n:d;}
function money(n,sign){var a=Math.abs(n),s=(Math.round(a*100)%100)?a.toFixed(2):Math.round(a).toLocaleString("en");return (n<0?"−":(sign&&n>0?"+":""))+S().cur+s;}
function tone(n){return n>0?"pos":"";}
function dur(min){min=Math.max(0,Math.round(min));var h=Math.floor(min/60),m=min%60;return h?h+"h "+("0"+m).slice(-2)+"m":m+"m";}
function iso(t){var d=new Date(t);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12);}
function nice(s,i){return s.date?pd(s.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):"Visit "+(i+1);}
function sorted(){return state.sessions.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);});}
function sum(a){return a.reduce(function(x,y){return x+y;},0);}
function phi(z){var t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2),p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}
function handsOf(s){if(s.hands)return s.hands;if(s.minutes)return s.minutes/60*(RATE[s.table]||100);return null;}
function ev(s){var h=handsOf(s);if(!h||!s.bet)return null;return {mean:-0.005*h*s.bet,sd:1.15*s.bet*Math.sqrt(h),hands:h};}
function oneIn(p){p=Math.max(p,0.0005);var x=1/p;return x<2.05?"about 1 in 2":"1 in "+Math.round(x);}
function luck(s){var e=ev(s);if(!e)return null;var z=(s.net-e.mean)/e.sd,bad=z<0;
  function at(f){var h=e.hands*f,m=-0.005*h*s.bet,sd=1.15*s.bet*Math.sqrt(h),zz=(s.net-m)/sd;return bad?phi(zz):1-phi(zz);}
  var a=at(0.75),b=at(1.3),lo=Math.max(a,b),hi=Math.min(a,b);
  return {z:z,bad:bad,edge:e.mean,luck:s.net-e.mean,range:Math.round(1/lo)===Math.round(1/hi)?oneIn(lo):oneIn(lo)+" to "+oneIn(hi),typical:Math.abs(z)<0.5};}
function streak(list){var t=list.filter(function(s){return s.kept===true||s.kept===false;}),n=0;for(var i=t.length-1;i>=0&&t[i].kept;i--)n++;return n;}
function monthNet(){var m=iso(Date.now()).slice(0,7);return sum(state.sessions.filter(function(s){return s.date&&s.date.slice(0,7)===m;}).map(function(s){return s.net;}));}
function lastEnd(){var m=0;state.sessions.forEach(function(s){if(s.endAt&&s.endAt>m)m=s.endAt;});return m;}
function blocks(){var out=[],st=S(),left=lastEnd()+st.cooloffH*3600000-Date.now();
  if(st.cooloffH>0&&left>0)out.push({k:"cooloff",t:"Cool-off: "+dur(left/60000)+" left",d:"You set a "+st.cooloffH+"-hour gap between sessions."});
  if(st.budget>0&&st.budget+monthNet()<st.buyIn)out.push({k:"budget",t:"This month's budget can't cover a buy-in",d:money(Math.max(0,st.budget+monthNet()))+" left of "+money(st.budget)+"."});
  return out;}
function tween(el,to,ms){if(!el)return;var from=num(el.dataset.v,to);el.dataset.v=to;if(from===to){el.textContent=money(to);return;}
  var t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/(ms||320)),e=1-Math.pow(1-k,3),v=from+(to-from)*e;
    el.textContent=money(Math.abs(to%1)?Math.round(v*100)/100:Math.round(v));if(k<1&&num(el.dataset.v)===to)requestAnimationFrame(f);else if(k>=1)el.textContent=money(to);})(t0);}
var IC={
  home:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
  stats:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>',
  list:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  gear:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
  plus:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  ok:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D9B26A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  okd:'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0A0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  no:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F0897B" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
function seg(act,opts,val,cls){return '<div class="seg '+(cls||"")+'" data-seg><div class="thumb"></div>'+opts.map(function(o){return '<button class="press" data-a="'+act+'" data-v="'+esc(o[0])+'" aria-pressed="'+(String(o[0])===String(val))+'">'+esc(o[1])+'</button>';}).join("")+'</div>';}
function placeThumbs(root){(root||document).querySelectorAll("[data-seg]").forEach(function(s){var b=s.querySelector('[aria-pressed="true"]'),t=s.querySelector(".thumb");if(!b){t.style.width="0";return;}t.style.left=b.offsetLeft+"px";t.style.width=b.offsetWidth+"px";});}

/* ================= charts ================= */
function lineChart(id,ys,labels,o){o=o||{};var W=350,H=o.h||130,p=8,all=ys.concat(o.band?o.band.lo.concat(o.band.hi):[],[0]);
  var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);if(hi===lo)hi=lo+1;var n=ys.length;
  function x(i){return n>1?i/(n-1)*W:W/2;}function y(v){return p+(H-2*p)*(hi-v)/(hi-lo);}
  charts[id]={ys:ys,labels:labels,n:n,yp:function(i){return y(ys[i])/H*100;}};
  var pts=ys.map(function(v,i){return x(i).toFixed(1)+","+y(v).toFixed(1);}).join(" "),band="",exp="";
  if(o.band){band='<polygon fill="#F2F2F3" opacity=".07" points="'+o.band.hi.map(function(v,i){return x(i).toFixed(1)+","+y(v).toFixed(1);}).join(" ")+" "+o.band.lo.map(function(v,i){return x(i).toFixed(1)+","+y(v).toFixed(1);}).reverse().join(" ")+'"/>';
    exp='<polyline fill="none" stroke="#9A9AA2" stroke-width="1.5" stroke-dasharray="4 4" points="'+o.band.mid.map(function(v,i){return x(i).toFixed(1)+","+y(v).toFixed(1);}).join(" ")+'"/>';}
  return '<div class="chart" data-chart="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||"Chart")+'">'
    +'<line x1="0" x2="'+W+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" stroke="#2E2E33" stroke-width="1"/>'+band+exp
    +'<polyline fill="none" stroke="#F2F2F3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>'
    +'<circle cx="'+x(n-1).toFixed(1)+'" cy="'+y(ys[n-1]).toFixed(1)+'" r="4" fill="#D9B26A"/></svg>'
    +'<div class="cur" hidden></div><div class="dot" hidden></div></div>'
    +'<div class="sp s13 dim" data-tip="'+id+'"><span>'+esc(o.left||"")+'</span><span>'+esc(o.right||"Drag across to inspect")+'</span></div>';}
function barChart(id,ys,labels,sd){var W=350,H=140,p=8,all=ys.concat([0,sd,-sd]),lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),n=ys.length,bw=W/n;
  function y(v){return p+(H-2*p)*(hi-v)/(hi-lo);}
  charts[id]={ys:ys,labels:labels,n:n,bar:true,yp:function(i){return y(ys[i])/H*100;}};
  var out=ys.map(function(v,i){var a=y(0),b=y(v);return '<rect x="'+(i*bw+bw*.18).toFixed(1)+'" y="'+Math.min(a,b).toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+Math.max(1.5,Math.abs(b-a)).toFixed(1)+'" rx="2" fill="'+(v>=0?"#7FD6A4":Math.abs(v)>sd?"#D9B26A":"#6B6B73")+'"/>';}).join("");
  return '<div class="chart" data-chart="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Luck on each night">'
    +'<rect x="0" width="'+W+'" y="'+y(sd).toFixed(1)+'" height="'+(y(-sd)-y(sd)).toFixed(1)+'" fill="#F2F2F3" opacity=".05" rx="4"/>'+out
    +'<line x1="0" x2="'+W+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" stroke="#55555C" stroke-width="1"/></svg><div class="cur" hidden></div><div class="dot" hidden></div></div>'
    +'<div class="sp s13 dim" data-tip="'+id+'"><span>Shaded: an ordinary night</span><span>Drag to inspect</span></div>';}
function scrub(ev){var c=ev.target.closest&&ev.target.closest(".chart");if(!c)return;var d=charts[c.dataset.chart];if(!d)return;

/* ================= simulator ================= */
function draw(){var r=Math.random();return r<.05?-2:r<.474?-1:r<.559?0:r<.9?1:r<.945?1.5:2;}
function simulate(st){var N=1500,cap=450,lose=0,small=0,bigw=0,other=0,hands=[],playOn=st.keep,i;
  for(i=0;i<N;i++){var t=st.buyIn,pk=0,h=0;
    while(t>=st.bet&&h<cap){t+=draw()*st.bet;h++;var trig=pk>0?playOn*2:st.lockAt;if(t>=trig&&t>playOn){pk+=t-playOn;t=playOn;}}
    var net=t+pk-st.buyIn;hands.push(h);if(net<=-st.buyIn+st.bet)lose++;else if(net<=0)other++;else if(net<=st.buyIn)small++;else bigw++;}
  hands.sort(function(a,b){return a-b;});
  return {lose:lose/N,other:other/N,small:small/N,big:bigw/N,medH:hands[Math.floor(N/2)]};}
var simCache={k:"",r:null};
function sim(){var st=S(),k=[st.buyIn,st.bet,st.lockAt,st.keep].join("|");if(simCache.k!==k)simCache={k:k,r:simulate(st)};return simCache.r;}

function vStats(){var all=sorted(),list=scope();
  var top=head("Stats")+seg("range",[["all","All"],["tracked","With rules"],["last10","Last 10"]],ui.range,"tall");
  if(!list.length)return top+'<div class="panel"><p class="dim">'+(ui.range==="tracked"?"Nothing here yet. Sessions you run in the app, with rules, show up in this view.":"No sessions yet.")+'</p></div>';
  var nets=list.map(function(s){return s.net;}),wins=nets.filter(function(n){return n>0;}),losses=nets.filter(function(n){return n<0;}),tot=sum(nets);
  var aw=wins.length?sum(wins)/wins.length:0,al=losses.length?sum(losses)/losses.length:0,mx=Math.max(aw,-al,1);
  // luck vs edge

  list.forEach(function(s){var e=ev(s);c+=s.net;if(e){m+=e.mean;v+=e.sd*e.sd;withEv++;sds.push(e.sd);}dev.push(Math.round(s.net-(e?e.mean:0)));run.push(Math.round(c));mid.push(m);lo.push(m-Math.sqrt(v));hi.push(m+Math.sqrt(v));labels.push(nice(s,all.indexOf(s)));});
  var z=v>0?(tot-m)/Math.sqrt(v):0,verdict=Math.abs(z)<1?"inside the normal range":z<0?(z<-2?"well below the normal range":"on the unlucky side of normal"):(z>2?"well above the normal range":"on the lucky side of normal");

    if(!old)state.sessions.push(o);save();closeSheet();},
  delAsk:function(){readQuick();ui.sheet.confirm=true;drawSheet();return 1;},
  delYes:function(){var id=ui.sheet.s.id;state.sessions=state.sessions.filter(function(x){return x.id!==id;});ui.flow=null;save();closeSheet();},
  /* settings */
  cur:function(b){S().cur=b.dataset.v;save();drawSheet();},cool:function(b){S().cooloffH=+b.dataset.v;save();drawSheet();},
  setStep:function(b){S().budget=Math.max(0,S().budget+(+b.dataset.d)*50);save();drawSheet();},
  backup:function(){var t=JSON.stringify(state);try{navigator.clipboard.writeText(t).then(function(){ui.sheet.copied=true;drawSheet();},function(){});}catch(e){}return 1;},
  restore:function(){try{var s=JSON.parse(document.getElementById("sh-restore").value);if(!s||!s.sessions)throw 0;state=normalize(s);save();closeSheet();}catch(e){ui.sheet.msg="That isn't a valid backup";drawSheet();return 1;}}
};
function readQuick(){var e=ui.sheet.s;e.amt=document.getElementById("q-amt").value;e.date=document.getElementById("q-date").value;e.minutes=document.getElementById("q-min").value;e.bet=document.getElementById("q-bet").value;e.buys=document.getElementById("q-buys").value;}
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-a]");if(!b||b.disabled)return;var f=ACT[b.dataset.a];if(!f)return;var skip=f(b);if(!skip)render();});
/* hold to commit */
var holdT=null;
function holdEnd(ev){if(ev&&ev.type==="pointerleave"&&!(ev.target.matches&&ev.target.matches("[data-hold]")))return;clearTimeout(holdT);holdT=null;var h=document.querySelector(".hold.holding");if(h)h.classList.remove("holding");}
document.addEventListener("pointerdown",function(ev){var h=ev.target.closest&&ev.target.closest("[data-hold]");if(!h)return;h.classList.add("holding");holdT=setTimeout(function(){holdT=null;startSession();},900);});
["pointerup","pointercancel","pointerleave"].forEach(function(n){document.addEventListener(n,holdEnd,true);});
document.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target.closest&&ev.target.closest("[data-hold]")){ev.preventDefault();startSession();}});
/* chart scrub */
var scrubbing=false;
document.addEventListener("pointerdown",function(ev){if(ev.target.closest&&ev.target.closest(".chart")){scrubbing=true;scrub(ev);}});
document.addEventListener("pointermove",function(ev){if(scrubbing)scrub(ev);});
["pointerup","pointercancel"].forEach(function(n){document.addEventListener(n,function(){scrubbing=false;});});
window.addEventListener("resize",function(){placeThumbs();});
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick();});

loadLocal();if(state.live)ui.flow="live";render();connect();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!(window.claude&&window.claude.use)){navigator.serviceWorker.register("sw.js").catch(function(){});}
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(function(){return {tab:ui.tab};});}catch(e){}}
})();
</script>
